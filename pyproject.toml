[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-compression-agent"
description = "Budgeted compression and validation for local Qwen2.5-VL checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

[project.scripts]
vlm-compression-agent = "vlm_compression_agent.controller:main"

[tool.setuptools]
packages = ["vlm_compression_agent"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "vlm_compression_agent.__version__"}

[tool.setuptools.package-data]
vlm_compression_agent = ["visionzip.yaml", "AngelSlim-LICENSE.txt"]
